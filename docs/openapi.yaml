  /xijian/safety/gate/disable:
    post:
      tags:
      - xijian.safety
      operationId: gate_disable
      summary: Two-step disable flow.
      description: |-
        Two-step disable flow.

        Step 1 (no ``challenge_id`` in body): starts a challenge,
        returns ``{challenge_id, expires_at, challenge_phrase}``.

        Step 2 (``challenge_id`` + ``phrase`` in body): confirms the
        challenge and flips ``enabled`` to False.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id055
                type: object
                properties:
                  challenge_id:
                    type: string
                  expires_at:
                    type: integer
                  challenge_phrase:
                    type: string
                  enabled:
                    type: boolean
                  disabled_at:
                    type: string
                  error:
                    type: object
                additionalProperties: true
        '201':
          description: Created / 创建成功
          content:
            application/json:
              schema: *id055
