                  id:
                    type: string
                  object:
                    type: string
                  bytes:
                    type: string
                  created_at:
                    type: integer
                  filename:
                    type: string
                  purpose:
                    type: string
                  path:
                    type: string
                  bytes_count:
                    type: string
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - files
      operationId: list_files
      summary: List uploaded files. / 列出已上传的文件。
      responses:
        '200':
          description: Success / 成功
          content:
