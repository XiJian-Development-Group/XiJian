  /batches:
    post:
      tags:
      - batches
      operationId: create_batch
      summary: Create a new batch job. / 创建新的批处理任务。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                completion_window:
                  type: string
                metadata:
                  type: object
              additionalProperties: true
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id005
                type: object
                properties:
                  total:
                    type: integer
                  completed:
                    type: boolean
                  failed:
                    type: boolean
