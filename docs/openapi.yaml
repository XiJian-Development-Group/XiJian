            schema:
              type: object
              properties:
                model:
                  type: string
                dimensions:
                  type: string
                encoding_format:
                  type: string
              additionalProperties: true
              required:
              - dimensions
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id009
                type: object
                properties:
                  object:
                    type: string
                  data:
                    type: array
                  model:
                    type: string
                  usage:
                    type: string
                  xijian:
                    type: object
                additionalProperties: true
        '201':
          description: Created / 创建成功
          content:
            application/json:
              schema: *id009
        '400':
          $ref: '#/components/responses/BadRequest'
  /files:
    post:
      tags:
      - files
      operationId: upload_file
      summary: Upload via multipart or raw body.
      description: |-
        Upload via multipart or raw body.

        Multipart form expects ``file`` and ``purpose``. Raw bodies use
        the ``filename`` query parameter and default ``purpose="user_data"``.

        通过 multipart 或原始 body 上传。

        Multipart 表单期望 ``file`` 和 ``purpose``。原始 body 使用
        ``filename`` 查询参数并默认 ``purpose="user_data"``。
      parameters:
      - name: filename
        in: query
        required: false
        schema:
          type: string
      - name: purpose
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
