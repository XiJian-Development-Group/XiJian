      operationId: completions
      summary: Legacy text completion endpoint. / 传统的文本补全端点。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                xijian:
                  type: object
              additionalProperties: true
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id008
                type: object
                additionalProperties: true
        '201':
          description: Created / 创建成功
          content:
            application/json:
              schema: *id008
        '400':
          $ref: '#/components/responses/BadRequest'
  /embeddings:
    post:
      tags:
      - embeddings
      operationId: embeddings
      summary: Create embeddings for the given input. / 为给定输入创建嵌入向量。
      requestBody:
        required: true
        content:
