components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 启动时随机生成，写入 /tmp/xijian-<pid>.token，仅 127.0.0.1 访问
  parameters:
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
      description: 模型 ID
    OperationId:
      name: op_id
      in: path
      required: true
      schema:
        type: string
      description: 加载/卸载操作 ID
    VideoId:
      name: video_id
      in: path
      required: true
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    AssistantId:
      name: asst_id
      in: path
      required: true
      schema:
        type: string
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: msg_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    StepId:
      name: step_id
      in: path
      required: true
      schema:
        type: string
    CharacterId:
      name: character_id
      in: path
      required: true
      schema:
        type: string
      description: 角色 ID
    InteractionId:
      name: interaction_id
      in: path
      required: true
      schema:
        type: string
    WorldId:
      name: world_id
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    BackupId:
      name: backup_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页数量（默认 20，最大 100）
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    After:
      name: after
      in: query
      schema:
        type: string
      description: 游标（上一页 last_id）
    Before:
      name: before
      in: query
      schema:
        type: string
      description: 游标（下一页 first_id）
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAIError'
    Unauthorized:
      description: 鉴权失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAIError'
    Forbidden:
      description: 权限不足（如关闭保护系统前未双重确认）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAIError'
    NotFound:
      description: 资源不存在（角色/模型/文件）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAIError'
    NoContent:
      description: 成功无 body（abort、delete）
  schemas:
    OAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              example: invalid_request_error
            param:
              type: string
            code:
              type: string
              example: invalid_value
      example:
        error:
          message: 'Invalid value for ''temperature'': must be between 0 and 2'
          type: invalid_request_error
          param: temperature
          code: invalid_value
    JSONRPCError:
      type: object
      properties:
        jsonrpc:
          type: string
          example: '2.0'
        id:
          type: string
        error:
          type: object
          properties:
            code:
              type: integer
              example: -32602
            message:
              type: string
            data:
              type: object
    Model:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
        owned_by:
          type: string
        xijian:
          type: object
          properties:
            backend:
              type: string
              enum:
              - mlx
              - gguf
            family:
              type: string
            size_b:
              type: number
            quant:
              type: string
            context_length:
              type: integer
            min_ram_gb:
              type: integer
            loaded:
              type: boolean
    ModelOperation:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model.load
        status:
          type: string
          enum:
          - loading
          - unloading
          - completed
          - failed
        progress_url:
          type: string
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type: string
        name:
          type: string
    XiJianChatExtension:
      type: object
      description: 隙间特有扩展字段，不影响 OAI 客户端
      properties:
        character_id:
          type: string
          description: 当前角色 ID，启用角色系统 Prompt 注入
        world_id:
          type: string
          description: 当前世界 ID，注入世界状态
        nsfw_allowed:
          type: boolean
          default: false
        inject_memory:
          type: boolean
          default: true
          description: 是否自动检索长期记忆并注入
        memory_top_k:
          type: integer
          default: 5
          description: 注入的记忆条数
        guard_level:
          type: string
          enum:
          - strict
          - standard
          - relaxed
          default: standard
    ChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        top_p:
          type: number
          default: 1.0
        max_tokens:
          type: integer
        stream:
          type: boolean
          default: false
        stop:
          type: array
          items:
            type: string
        presence_penalty:
          type: number
          default: 0
        frequency_penalty:
          type: number
          default: 0
        n:
          type: integer
          default: 1
        user:
          type: string
        tools:
          type: array
          items:
            type: object
        tool_choice:
          type: string
        response_format:
          type: object
        logprobs:
          type: boolean
        stream_options:
          type: object
        xijian:
          $ref: '#/components/schemas/XiJianChatExtension'
    ChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
              logprobs:
                type: object
                nullable: true
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        xijian:
          type: object
          properties:
            backend:
              type: string
            guard_triggered:
              type: boolean
            memory_hits:
              type: integer
    ChatCompletionChunk:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              delta:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
                nullable: true
        usage:
          type: object
          nullable: true
    EmbeddingRequest:
      type: object
      required:
      - model
      - input
      properties:
        model:
          type: string
          example: bge-m3
        input:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        encoding_format:
          type: string
          enum:
          - float
          - base64
          default: float
        dimensions:
          type: integer
          example: 1024
    EmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
    SpeechRequest:
      type: object
      required:
      - model
      - input
      - voice
      properties:
        model:
          type: string
          example: cosyvoice-tts
        input:
          type: string
        voice:
          type: string
        response_format:
          type: string
          default: mp3
        speed:
          type: number
          default: 1.0
        xijian:
          type: object
          properties:
            voice_clone_ref:
              type: string
            emotion:
              type: string
    Transcription:
      type: object
      properties:
        text:
          type: string
    ImageGenerationRequest:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        n:
          type: integer
          default: 1
        size:
          type: string
          default: 1024x1024
        response_format:
          type: string
          enum:
          - url
          - b64_json
          default: b64_json
        xijian:
          type: object
          properties:
            negative_prompt:
              type: string
            seed:
              type: integer
            nsfw_allowed:
              type: boolean
    ImageGenerationResponse:
