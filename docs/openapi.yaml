paths:
  /:
    get:
      tags:
      - root
      operationId: v1_index
      summary: Return API version and capabilities (DESIGN §12).
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                  server_version:
                    type: string
                  capabilities:
                    type: array
                additionalProperties: true
  /assistants:
    post:
      tags:
      - assistants
      operationId: create_assistant
      summary: Create a new assistant. / 创建新助手。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                name:
                  type: string
                description:
                  type: string
                instructions:
                  type: string
                tools:
                  type: object
                metadata:
                  type: object
              additionalProperties: true
              required:
              - name
              - description
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id001
                type: object
                additionalProperties: true
        '201':
          description: Created / 创建成功
          content:
            application/json:
              schema: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
      - assistants
      operationId: list_assistants
      summary: List all assistants. / 列出所有助手。
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  data:
                    type: array
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                  last_id:
                    type: string
                additionalProperties: true
  /assistants/{assistant_id}:
    post:
      tags:
      - assistants
      operationId: modify_assistant
      summary: Modify assistant
      parameters:
      - name: assistant_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - assistants
      operationId: get_assistant
      summary: Get assistant
      parameters:
      - name: assistant_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - assistants
      operationId: delete_assistant
      summary: Delete assistant
      parameters:
      - name: assistant_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /audio/speech:
    post:
      tags:
      - audio
      operationId: speech
      summary: Text-to-speech synthesis. / 文本转语音合成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                voice:
                  type: string
                response_format:
                  type: string
                emotion:
                  type: string
              additionalProperties: true
              required:
              - emotion
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id002
                type: object
                additionalProperties: true
        '201':
          description: Created / 创建成功
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
  /audio/transcriptions:
    post:
