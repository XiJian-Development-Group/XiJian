                properties:
                  object:
                    type: string
                  data:
                    type: array
                  has_more:
                    type: boolean
                  first_id:
                    type: string
                  last_id:
                    type: string
                additionalProperties: true
  /files/{file_id}:
    get:
      tags:
      - files
      operationId: get_file
      summary: Retrieve file metadata by ID. / 根据 ID 检索文件元数据。
      parameters:
