- name: xijian.mcp
  description: 隙间扩展 - MCP 桥接（规划中）
- name: mcp
  description: mcp
- name: xijian.economy
  description: xijian.economy
- name: xijian.event
  description: xijian.event
- name: xijian.generation
  description: xijian.generation
- name: xijian.npc
  description: xijian.npc
- name: xijian.overload
