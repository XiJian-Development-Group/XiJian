      operationId: cancelBatch
      summary: 取消批处理任务
      parameters:
      - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                type: object
  /batches/{batch_id}/results:
    get:
      tags:
      - batches
      operationId: getBatchResults
      summary: 下载批处理结果文件
      parameters:
      - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: 结果文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /chat/abort:
    post:
      tags:
      - chat
      operationId: chat_abort
      summary: Abort a streaming request by request_id. / 通过 request_id 中止流式请求。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id006
                type: object
                properties:
                  aborted:
                    type: string
                  request_id:
                    type: string
                additionalProperties: true
        '201':
          description: Created / 创建成功
          content:
            application/json:
              schema: *id006
        '400':
          $ref: '#/components/responses/BadRequest'
  /chat/completions:
    post:
      tags:
      - chat
      operationId: chat_completions
      summary: Chat completion endpoint (sync or streaming). / 聊天补全端点（同步或流式）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                max_tokens:
                  type: string
                stop:
                  type: string
                user:
                  type: string
                xijian:
                  type: string
                tools:
                  type: string
                tool_choice:
                  type: string
                messages:
                  type: string
                temperature:
                  type: number
                top_p:
                  type: number
                n:
                  type: integer
                stream:
                  type: boolean
                stream_options:
                  type: string
              additionalProperties: true
              required:
              - max_tokens
              - stop
              - user
              - xijian
              - tools
              - tool_choice
              - messages
              - stream_options
      responses:
        '200':
          description: Success / 成功
          content:
            application/json:
              schema: &id007
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                  usage:
                    type: string
                  xijian:
                    type: object
                  backend:
                    type: string
                  prompt_tokens:
                    type: string
                  completion_tokens:
                    type: string
                  total_tokens:
                    type: string
                  index:
                    type: string
                  message:
                    type: string
                  finish_reason:
                    type: string
                  logprobs:
                    type: string
                  role:
                    type: string
                  content:
                    type: array
                  enabled:
                    type: boolean
                  rounds:
                    type: string
                  tool_calls:
                    type: string
                  truncated:
                    type: string
                  note:
                    type: string
                  tool_call_id:
                    type: string
                  name:
                    type: string
                  arguments:
                    type: string
                  result:
                    type: string
                  is_error:
                    type: string
                  error_type:
                    type: string
                  type:
                    type: string
                  function:
                    type: string
