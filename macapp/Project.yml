name: XiJian
options:
  bundleId: com.xijian.app
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.42.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  renderEmptyGroups: false
  developmentRegion: en
  usesTabs: false
  indentWidth: 2
  tabWidth: 2

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2024 XiJian. All rights reserved."
    INFOPLIST_KEY_NSPrincipalClass: NSApplication
    INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
    INFOPLIST_KEY_NSSupportsAutomaticGraphicsSwitching: true
    INFOPLIST_KEY_NSHighResolutionCapable: true
    INFOPLIST_KEY_CFBundleDisplayName: XiJian
    INFOPLIST_KEY_CFBundleName: XiJian
    INFOPLIST_KEY_CFBundleIdentifier: com.xijian.app
    INFOPLIST_KEY_CFBundleVersion: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSAppTransportSecurity: '{"NSAllowsArbitraryLoads": true, "NSExceptionDomains": {"localhost": {"NSExceptionAllowsInsecureHTTPLoads": true}}}'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: true
    OTHER_LDFLAGS: -ObjC
    SWIFT_EMIT_LOC_STRINGS: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    ENABLE_TESTING_SEARCH_PATHS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    BUILD_LIBRARY_FOR_DISTRIBUTION: false
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    COPY_PHASE_STRIP: false
    STRIP_INSTALLED_PRODUCT: false
    STRIP_STYLE: non-global
  debug:
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    DEBUG_INFORMATION_FORMAT: dwarf
    MTL_ENABLE_DEBUG_INFO: true
    ENABLE_TESTABILITY: true
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  release:
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    MTL_ENABLE_DEBUG_INFO: false
    SWIFT_COMPILATION_MODE: wholemodule
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEAD_CODE_STRIPPING: true

targets:
  # 逻辑层 + UI 层框架：Services / Models / Theme / ViewModels / Views。
  # 独立 framework 使单元测试可无宿主运行（SwiftUI @main 应用无法作为
  # XCTest 宿主），App target 仅保留 @main 入口。
  XiJianKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Services
      - path: Sources/Models
      - path: Sources/Theme
      - path: Sources/ViewModels
      - path: Sources/Views
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xijian.app.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_MODULE_VERIFIER: YES
        DEFINES_MODULE: YES

  XiJian:
    type: application
    platform: macOS
    sources:
      - path: Sources/App.swift
      # XcodeGen 2.45 不再处理 target 级 resources 键，改用 buildPhase 自动分类：
      # Assets.xcassets 编译进资源目录；Core 以文件夹引用整体复制，
      # 保持 onedir 结构在 Contents/Resources/Core/（启动时整目录复制到应用数据目录）。
      - path: Resources/Assets.xcassets
      - path: Resources/Core
        type: folder
    dependencies:
      - target: XiJianKit
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Entitlements.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.xijian.app
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  XiJianTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: XiJianKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xijian.app.tests
        INFOPLIST_FILE: Tests/Info.plist
        # 无宿主逻辑测试：依赖 XiJianKit 框架（可正常链接），不启动 App
        TEST_HOST: ""
        BUNDLE_LOADER: ""

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0

schemes:
  XiJian:
    build:
      targets:
        XiJian: all
        XiJianTests: [test]
    run:
      config: Debug
      executable: XiJian
    test:
      config: Debug
      targets:
        - XiJianTests
    analyze:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
      executable: XiJian

fileGroups: {}
