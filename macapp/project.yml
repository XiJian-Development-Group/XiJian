name: XiJianManager
options:
  bundleIdPrefix: com.skyc8266.xi-jian-manager
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  swiftVersion: "5.9"
  xcodeVersion: "27.0"
  pkgConfig: false
  bundleId: com.skyc8266.xi-jian-manager-dev
  configFiles:
    Debug: Configs/Debug.xcconfig
    Release: Configs/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_PREVIEWS: YES
    INFOPLIST_FILE: Sources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.xi-jian-manager-dev
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  XiJianManagerKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/App.swift"
    settings:
      base:
        PRODUCT_NAME: XiJianManagerKit
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.xi-jian-manager.kit
        SWIFT_MODULE_NAME: XiJianManagerKit
        DEFINES_MODULE: YES
        INSTALL_PATH: "@loader_path/../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - package: swift-markdown-ui
        products:
          - MarkdownUI
      - package: NetworkImage
        products:
          - NetworkImage
      - package: cmark-gfm
        products:
          - cmark-gfm

  XiJianManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/App.swift
    resources:
      - path: Resources/Assets.xcassets
        type: folder
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: XiJianManager
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.xi-jian-manager-dev
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements.entitlements
    dependencies:
      - target: XiJianManagerKit

  XiJianManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        createIntermediateGroups: true
    dependencies:
      - target: XiJianManagerKit

    # Tests target disabled in Phase 1.4 — re-enabled in task 1.4 once new
    # HermesInstaller / HermesProcess / PTYTerminal tests exist.
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DISABLE_TESTS

packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  NetworkImage:
    url: https://github.com/gonzalezreal/NetworkImage
    from: 6.0.1
  cmark-gfm:
    url: https://github.com/swiftlang/swift-cmark
    from: 0.8.0

schemes:
  XiJianManager:
    build:
      targets:
        XiJianManagerKit: [all]
        XiJianManager: [all]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XiJianManagerTests
    archive:
      config: Release
