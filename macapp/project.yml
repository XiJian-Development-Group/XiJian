name: XiJian
options:
  bundleIdPrefix: com.skyc8266
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  swiftVersion: "5.9"
  xcodeVersion: "15.0"
  pkgConfig: false
  bundleId: com.skyc8266.xijian.macapp-dev
  configFiles:
    Debug: Configs/Debug.xcconfig
    Release: Configs/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_PREVIEWS: YES
    INFOPLIST_FILE: Sources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.xijian.macapp-dev
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  XiJianKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/App.swift"
    settings:
      base:
        PRODUCT_NAME: XiJianKit
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.xijian.kit
        SWIFT_MODULE_NAME: XiJianKit
        DEFINES_MODULE: YES
        INSTALL_PATH: "@loader_path/../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - package: swift-markdown-ui
        products:
          - MarkdownUI
      - package: NetworkImage
        products:
          - NetworkImage
      - package: cmark-gfm
        products:
          - cmark-gfm

  XiJian:
    type: application
    platform: macOS
    sources:
      - path: Sources/App.swift
    resources:
      - path: Resources/Assets.xcassets
        type: folder
      - path: Resources/Localizable.xcstrings
    postBuildScripts:
      - name: Copy Core Resources
        script: |
          rsync -av --delete "${PROJECT_DIR}/Resources/Core/" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Core/"
        inputFiles:
          - "$(PROJECT_DIR)/Resources/Core"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Core"
    settings:
      base:
        PRODUCT_NAME: XiJian
        PRODUCT_BUNDLE_IDENTIFIER: com.skyc8266.xijian.macapp-dev
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements.entitlements
    dependencies:
      - target: XiJianKit

  XiJianTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: XiJianKit

packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  NetworkImage:
    url: https://github.com/gonzalezreal/NetworkImage
    from: 6.0.1
  cmark-gfm:
    url: https://github.com/swiftlang/swift-cmark
    from: 0.8.0

schemes:
  XiJian:
    build:
      targets:
        XiJianKit: [all]
        XiJian: [all]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XiJianTests
    archive:
      config: Release
