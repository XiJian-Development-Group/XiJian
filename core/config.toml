[server]
host = "127.0.0.1"
port = 18500
dev = false
keep_token_file = false
testing = false
api_version = "1.0.0"
driver = "auto"

[auth]

[storage]
base_dir = "~/Library/Application Support/XiJian/Core"
files_subdir = "files"
models_subdir = "models"
snapshots_subdir = "snapshots"
audit_subdir = "audit"
packs_subdir = "packs"

[backends.chat]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.embeddings]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.tts]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.stt]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.image]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.video]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.multimodal]
default = "mlx"
fallbacks = [
    "gguf",
]

[backends.video_understanding]
default = "openai"
fallbacks = []

[backends.openai]
base_url = ""
api_key = ""
default_model = ""
transport = "httpx"
video_endpoint = "/video/generations"

[backends.openai.headers]

[ai]
default_max_new_tokens = 1024
default_context_length = 8192
mlx_cache_dir = ""
gguf_n_ctx = 4096
gguf_n_threads = 0
gguf_n_gpu_layers = 0

[[models]]
id = "qwen2.5-7b-mlx-4bit"
type = "chat"
backend = "mock"
filename = "Qwen2.5-7B-Instruct-4bit"
family = "qwen2.5"
size_b = 7.0
quant = "4bit"
context_length = 32768
min_ram_gb = 8
loaded = false

[[models]]
id = "qwen2.5-14b-mlx-4bit"
type = "chat"
backend = "mock"
filename = "Qwen2.5-14B-Instruct-4bit"
family = "qwen2.5"
size_b = 14.0
quant = "4bit"
context_length = 32768
min_ram_gb = 16
loaded = true

[[models]]
id = "qwen2.5-7b-gguf-q4km"
type = "chat"
backend = "mock"
filename = "qwen2.5-7b-instruct-q4_k_m.gguf"
family = "qwen2.5"
size_b = 7.0
quant = "q4_k_m"
context_length = 8192
min_ram_gb = 8
loaded = false

[[models]]
id = "stub-multimodal"
type = "multimodal"
backend = "mock"
filename = "mock-multimodal"
family = "mock"
context_length = 8192
loaded = false

[[models]]
id = "stub-video-understanding"
type = "video_understanding"
backend = "mock"
filename = "mock-video-understanding"
family = "mock"
context_length = 8192
loaded = false

[features]
seed_default_data = false
protection_module = true
rate_limit = false
dev_test_emit = false

[snapshots]
compression_backend = "auto"

[overload]
monitor = true
tier = "medium"
